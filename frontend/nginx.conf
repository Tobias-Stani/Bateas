server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 50m;  # el Excel pesa varios MB (default de nginx: 1m)

    # HTML, JS y CSS se revalidan siempre (304 si no cambiaron): sin esto el navegador
    # puede mezclar un index.html nuevo con un .js viejo después de actualizar la app
    location ~* \.(html|js|css)$ { add_header Cache-Control "no-cache"; }

    # mismas rutas que Pages en backend/app/static.py (producción): cada pantalla vive en views/<pantalla>/
    location = / { add_header Cache-Control "no-cache"; try_files /views/landing/index.html =404; }
    location ~ ^/super/?$ { add_header Cache-Control "no-cache"; try_files /views/super/index.html =404; }
    location ~ ^/cuenta/?$ { add_header Cache-Control "no-cache"; try_files /views/cuenta/index.html =404; }
    location = /logo.svg { return 301 /assets/img/logo.svg; }  # rutas de antes de assets/
    location = /bateas.svg { return 301 /assets/img/bateas.svg; }
    location ~ ^/[a-z0-9-]+/admin/?$ { add_header Cache-Control "no-cache"; try_files /views/admin/index.html =404; }
    location ~ ^/[a-z0-9-]+/?$ { add_header Cache-Control "no-cache"; try_files /views/tienda/index.html =404; }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;  # el backend arma links a sí mismo (vuelta de Discogs y Mercado Pago)
        proxy_read_timeout 120s;
    }
}
