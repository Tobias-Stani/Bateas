server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 50m;  # el Excel pesa varios MB (default de nginx: 1m)

    # HTML, JS y CSS se revalidan siempre (304 si no cambiaron): sin esto el navegador
    # puede mezclar un index.html nuevo con un .js viejo después de actualizar la app
    location ~* \.(html|js|css)$ { add_header Cache-Control "no-cache"; }

    # mismas rutas que Pages en backend/app.py (producción)
    location = / { add_header Cache-Control "no-cache"; try_files /home.html =404; }
    location ~ ^/super/?$ { add_header Cache-Control "no-cache"; try_files /super.html =404; }
    location ~ ^/[a-z0-9-]+/admin/?$ { add_header Cache-Control "no-cache"; try_files /admin.html =404; }
    location ~ ^/[a-z0-9-]+/?$ { add_header Cache-Control "no-cache"; try_files /index.html =404; }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;  # el backend arma links a sí mismo (vuelta de Discogs)
        proxy_read_timeout 120s;
    }
}
