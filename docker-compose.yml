# nombre fijo: contenedores y volumen no dependen de cómo se llame la carpeta
name: bateas

services:
  backend:
    build: ./backend
    # --reload para desarrollo; sacarlo en producción
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      # desarrollo: si no está en .env, la contraseña de /super es "super"
      SUPER_PASSWORD: ${SUPER_PASSWORD:-super}
      DATA_DIR: /data
      # app de Discogs (opcionales: sin ellas el admin no muestra la conexión)
      DISCOGS_KEY: ${DISCOGS_KEY:-}
      DISCOGS_SECRET: ${DISCOGS_SECRET:-}
      # app de Mercado Pago (opcionales: sin ellas no hay pagos online)
      MP_CLIENT_ID: ${MP_CLIENT_ID:-}
      MP_CLIENT_SECRET: ${MP_CLIENT_SECRET:-}
      MP_FEE_PERCENT: ${MP_FEE_PERCENT:-0}
      MP_TEST: ${MP_TEST:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}  # solo desarrollo: sin OAuth ni comisión
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}  # "Continuar con Google"
    volumes:
      - ./backend:/app
      - data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${PORT:-8000}:80"
    volumes:
      # montado: los cambios en los HTML se ven con F5
      - ./frontend/public:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data:
